      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="tag" x1="40" y1="68" x2="216" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
